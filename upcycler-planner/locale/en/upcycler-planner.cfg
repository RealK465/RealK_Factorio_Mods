no-filter-inserter=No researched inserter can filter items, and a Bots loop needs one.
inserter-no-filter=__1__ can't filter items. Pick an inserter that can.
only-fuelled-inserters=Every inserter you have researched needs fuel. Research an electric one first.
no-module-slots=__1__ has no module slots.
