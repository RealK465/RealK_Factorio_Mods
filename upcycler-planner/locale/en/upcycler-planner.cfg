[mod-name]
upcycler-planner=Upcycler Planner

[mod-description]
upcycler-planner=Choose an item and a target quality, the mod designs the entire upcycling loop blueprint and places it as ghosts.

[shortcut-name]
upl-open=Upcycler Planner

[shortcut-description]
upl-open=Design an upcycling loop and place it as ghosts.

[item-name]
upl-planner=Upcycler placement tool

[item-description]
upl-planner=Click the ground where the loop should be placed.

[upl-gui]
title=Upcycler Planner
settings=Settings
settings-tooltip=What the pickers offer: unresearched items, and build options hidden because the game gives you only one choice.
recipe=Item to upcycle
recipe-tooltip=Only items whose recycling returns their own ingredients can be looped.
quality=Target quality
quality-tooltip=The loop upgrades one tier at a time, up to this quality.
machine=Crafting machine
machine-tooltip=One per quality tier. More module slots and built-in productivity mean a better loop. The quality here is the machine's own, not the loop's output.
recycler=Recycler
recycler-tooltip=Placed under each machine below the target — recycled ingredients go straight back in. The quality here is the recycler's own, not its output.
build-options=Build options
belt=Belt
belt-tooltip=The belt the ring is built from. Defaults to your fastest; a slower one works fine since the ring is short. Belt quality has no effect.
inserter=Inserter
inserter-tooltip=Every inserter in the loop. Only inserters reaching exactly one tile can serve the layout's stacked rows, so long-handed and belt-stacking ones are never offered; nor are burner inserters, since nothing here refuels them. Higher quality swings faster.
requester=Requester chest
requester-tooltip=Feeds each machine, and holds product for its recycler. Its logistic request is what seeds the loop from your base. Higher quality holds more.
container=Buffer chest
container-tooltip=The relief buffer beside each recycler: it takes ingredients rolled above their tier and puts them back on the ring. A plain chest, never a logistic one, so the loop cannot compete with your base for its own items. Higher quality holds more.
provider=Output chest
provider-tooltip=Where finished items leave the loop, on the last tier. A passive provider, so your bots collect from it as the base asks. Higher quality holds more.
quality-module=Quality module
quality-module-tooltip=Fills every machine below the target, and every recycler. The top machine gets its own module, picked beside this one.
terminal-module=Top machine module
terminal-module-tooltip=Goes in the last machine, the one crafting at your target quality. Quality has nothing left to roll into there, so this defaults to your best productivity module — or to nothing at all when the recipe or the machine refuses productivity, which most recipes do. Only modules that machine and recipe accept are offered. Clear it to leave the top machine empty.
pole=Electric pole
pole-tooltip=Powers every building and wires them into one network, placed in a dedicated column before each machine. Defaults to the longest-reaching 1x1 pole you have researched; substations can be picked but are never chosen automatically. Higher quality extends reach. Clear to place no poles.
pipe=Pipe
pipe-tooltip=Used only for recipes with a fluid ingredient: a pipe run feeds each machine, ending in underground stubs under the loop's north and south belts. Connect your supply with an underground pipe of your own, from either side. Defaults to your best researched pipe.
trash-unrequested=Trash unrequested items
trash-unrequested-tooltip=Requester chests ask bots to remove anything not requested, preventing clogs from wrong-quality rolls. Untick to keep surplus in place.
footprint=Footprint: __1__ x __2__ tiles
summary=__1__ machines, __2__ __plural_for_parameter__2__{1=recycler|rest=recyclers}__
confirm=Place
cancel=Cancel
pick-a-recipe=Pick an item to upcycle.

[mod-setting-name]
upcycler-planner-show-all=Show unresearched items
upcycler-planner-show-all-build-options=Show all build options

[mod-setting-description]
upcycler-planner-show-all=Offer every item, machine, quality tier and building in the planner, even before it is researched. The loop is still placed as ghosts, so it waits for the research rather than breaking.
upcycler-planner-show-all-build-options=Show every build option, including the ones hidden because the game offers only one — so their quality can be picked too. Also shows the pipe on recipes without a fluid.

