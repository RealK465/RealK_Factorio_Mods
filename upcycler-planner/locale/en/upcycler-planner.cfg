no-pipe=No pipe is researched yet.
no-pipe-to-ground=No underground pipe is researched yet.
too-many-ingredients=This recipe has more ingredients than any inserter can filter.
inserter-too-few-filters=__1__ has too few filter slots: this recipe needs __2__. Pick an inserter with more.
only-fuelled-inserters=Every inserter you have researched needs fuel. Research an electric one first.
no-module-slots=__1__ has no module slots.
no-quality-effect=__1__ can't accept quality modules.
quality-not-researched=__1__ quality is not researched yet. The loop will wait for it.
recipe-not-researched=This recipe is not researched yet. The loop will wait for it.
planner-not-researched=Requires the __1__ technology.
no-machine-available=No machine can craft this recipe.
no-recycler=No usable recycler. Turn on Show all build options to pick one.
recycler-no-eject=__1__ can't throw its output into the machine above it.
recycler-needs-wider-machine=__1__ needs a machine at least __2__ tiles wide.
no-belt=No belt is researched yet.
no-chest=No chest is researched yet.
no-logistic-chest=Requester and provider chests are not researched yet.
no-active-provider=No active provider chest is researched yet.
no-buffer-chest=No buffer chest is researched yet.
no-quality-module=No quality module is researched yet.
module-not-accepted=__1__ can't go in __2__.
module-not-accepted-by-recipe=__1__ can't be used on this recipe.
build-quality-not-researched=One of your picks is set to __1__ quality, which is not researched yet. The loop will wait for it.
