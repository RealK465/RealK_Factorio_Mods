circuit-unlinked=__1__ __plural_for_parameter__1__{1=building is|rest=buildings are}__ too far for a circuit wire and will run without limits.
circuit-wireless=__1__ can't connect to circuit wires, so __2__ __plural_for_parameter__2__{1=recycler|rest=recyclers}__ will run without limits.
circuit-min-too-big=The __1__ minimum plus the hand size is more than the stock chest holds. Pick a bigger chest, a lower minimum or a smaller hand.
request-too-big=The ingredient amounts need __1__ slots, but the ingredient chest has __2__. Lower the minutes or pick a bigger chest.
no-cursor=You need a character to hold the blueprint.
cursor-full=No room for the blueprint. Free an inventory slot and try again.
plan-failed=Planning failed. Reopen the planner and try again.
no-logistic-connection=__1__ can't connect to a logistic network. Untick Count the whole logistic network or pick another machine.
no-logistic-connection-bots=__1__ can't connect to a logistic network. Untick Circuit limits or pick another machine.
