[mod-name]
upcycler-planner=Upcycler Planner

[mod-description]
upcycler-planner=Choose an item and a target quality, the mod designs the entire upcycling loop blueprint and places it as ghosts.
[shortcut-name]
upl-open=Upcycler Planner

[shortcut-description]
upl-open=Design an upcycling loop and get it as a blueprint.

[controls]
upl-open=Toggle Upcycler Planner

[upl-gui]
title=Upcycler Planner
settings=Settings
settings-tooltip=Choose whether to show unresearched items and every build option.
recipe=Item to upcycle
recipe-tooltip=Only items that recycle back into their own ingredients can be looped.
quality=Target quality
quality-tooltip=The loop upgrades one tier at a time, up to this quality.
machine=Crafting machine
machine-tooltip=One per quality tier. The quality here is the machine's own, not the items it makes.
recycler=Recycler
recycler-tooltip=One per tier below your target, grinding items back into ingredients. The quality here is the recycler's own.
build-options=Build options
group-transport=Transport
group-chests=Chests
group-modules=Modules
group-beacons=Beacons
group-power=Power
group-circuits=Circuits
belt=Belt
belt-tooltip=Carries items around the loop. Belts have no quality bonus, so there is none to pick.
inserter=Inserter
inserter-tooltip=Only inserters that reach one tile fit the layout. Higher quality swings faster.
requester=Ingredient chest
requester-tooltip=Requests each machine's ingredients from your logistic network. Higher quality holds more.
stock=Stock chest
stock-tooltip=Holds each tier's items until its recycler takes them. Higher quality holds more.
container=Relay chest
container-tooltip=Passes ingredients that rolled above their tier back onto the belt. Higher quality holds more.
provider=Output chest
provider-tooltip=A passive provider for your finished items. Higher quality holds more.
overflow=Overflow chest
overflow-tooltip=Bots take away anything the loop rolls above your target quality. Higher quality holds more.
quality-module=Quality module
quality-module-tooltip=Goes in every machine and recycler below your target quality. Higher quality raises the odds.
terminal-module=Final machine module
terminal-module-tooltip=Goes in the machine at your target quality only. Nothing can roll higher there, so this defaults to productivity. Clear to leave it empty.
pole=Electric pole
pole-tooltip=Powers every building. Higher quality reaches further. Clear to place no poles.
pipe=Pipe
pipe-tooltip=Feeds fluid to the machines; connect your supply from either side with an underground pipe. Pipes have no quality bonus either.
beacon=Beacon
beacon-tooltip=Boosts each tier's machine and recycler, and widens the loop. Higher quality boosts more. Clear to place none.
beacon-module=Beacon module
beacon-module-tooltip=Fills every beacon. Defaults to efficiency, because speed modules also lower the quality odds of everything the beacon reaches. Clear to leave them empty.
beacon-count=Beacons per tier
beacon-count-tooltip=How many beacons stack per tier. Extra beacons add no width, and each one adds a little less.
circuit-enabled=Circuit limits
circuit-enabled-tooltip=Wires the loop so it stops once the output chest reaches your maximum, and keeps a minimum of each lower quality. Set both with Limits...
circuit-limits=Limits...
circuit-limits-tooltip=Set the minimum kept of each quality, and the maximum for the output chest.
circuit-limits-title=Circuit limits
circuit-min=Min
circuit-max=Max
circuit-keep-tooltip=The loop keeps this many items of this quality in its chest and only recycles what is above it. 0 keeps nothing back.
circuit-max-tooltip=The loop stops when the output chest holds this many. Taking items out starts it again. 0 means no limit.
buffer-stock=Use buffer chests
buffer-stock-tooltip=Each tier's items wait in buffer chests, so your logistic requests and construction bots can take them. Untick to keep every item in the loop.
trash-unrequested=Trash unrequested items
trash-unrequested-tooltip=Bots clear anything a chest did not request, so nothing clogs the loop.
footprint=Footprint: __1__ x __2__ tiles
summary=__1__ machines, __2__ __plural_for_parameter__2__{1=recycler|rest=recyclers}__
confirm=Place
cancel=Cancel
pick-a-recipe=Pick an item to upcycle.

[mod-setting-name]
upcycler-planner-show-all=Show unresearched items
upcycler-planner-show-all-build-options=Show all build options

[mod-setting-description]
upcycler-planner-show-all=Offer every item, machine and building in the planner, researched or not.
upcycler-planner-show-all-build-options=Show every build option, including the chests, the beacons and the ones with only one choice.

