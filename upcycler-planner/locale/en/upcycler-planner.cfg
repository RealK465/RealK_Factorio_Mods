[mod-name]
upcycler-planner=Upcycler Planner

[mod-description]
upcycler-planner=Choose an item and a target quality, the mod designs the entire upcycling loop blueprint and places it as ghosts.

[shortcut-name]
upl-open=Upcycler Planner

[shortcut-description]
upl-open=Design an upcycling loop and place it as ghosts.

[item-name]
upl-planner=Upcycler placement tool

[item-description]
upl-planner=Click the ground where the loop should be placed.

[upl-gui]
title=Upcycler Planner
recipe=Item to upcycle
recipe-tooltip=Only items whose recycling returns their own ingredients can be looped.
quality=Target quality
quality-tooltip=The loop upgrades one tier at a time, up to this quality.
machine=Crafting machine
machine-tooltip=One per quality tier. More module slots and built-in productivity mean a better loop. The quality here is the machine's own, not the loop's output.
recycler=Recycler
recycler-tooltip=Placed under each machine below the target — recycled ingredients go straight back in. The quality here is the recycler's own, not its output.
build-options=Build options
belt=Belt
belt-tooltip=The belt the ring is built from. Defaults to your fastest; a slower one works fine since the ring is short. Belt quality has no effect.
quality-module=Quality module
quality-module-tooltip=Fills every machine below the target and every recycler. The quality here also applies to the top machine's productivity modules.
pole=Electric pole
pole-tooltip=Powers every building and wires them into one network. Defaults to the longest-reaching 1x1 pole you have researched; substations can be picked but are never chosen automatically. Higher quality extends reach. Clear to place no poles.
trash-unrequested=Trash unrequested items
trash-unrequested-tooltip=Requester chests ask bots to remove anything not requested, preventing clogs from wrong-quality rolls. Untick to keep surplus in place.
footprint=Footprint: __1__ x __2__ tiles
summary=__1__ machines, __2__ __plural_for_parameter__2__{1=recycler|rest=recyclers}__
confirm=Place
cancel=Cancel
pick-a-recipe=Pick an item to upcycle.

[mod-setting-name]
upcycler-planner-show-all=Show unresearched options

[mod-setting-description]
upcycler-planner-show-all=Show every item, machine, quality, belt and recycler in the planner, even before researched.

[upl-message]
no-recycling-path=__1__ cannot be recycled back into its ingredients.
recycling-mismatch=Recycling __1__ does not return its own ingredients, so the loop would lose items.
fluid-not-supported=Fluid recipes are not supported yet.
too-many-ingredients=This recipe has more ingredients than an inserter can filter for.
only-fuelled-inserters=All available inserters need fuel. Research an electric inserter first.
no-module-slots=__1__ has no module slots and cannot roll quality.
no-quality-effect=__1__ cannot accept quality modules.
quality-not-researched=__1__ is not researched yet. The loop will be placed, but will not reach that quality until it is.
recipe-not-researched=This recipe is not researched yet. The loop will be placed, but will not run until it is.
no-machine-available=No available machine can craft this recipe.
no-recycler=Pick a recycler.
recycler-no-eject=__1__ cannot eject output into the machine above it.
recycler-needs-wider-machine=__1__ needs a machine at least __2__ tiles wide above it to catch its output.
no-belt=No transport belt researched yet.
no-chest=No chest researched yet.
no-logistic-chest=Requester and passive provider chests are not researched yet.
no-quality-module=No quality module researched yet.
module-not-accepted=__1__ cannot go in __2__.
module-not-accepted-by-recipe=__1__ cannot be used on this recipe.
build-quality-not-researched=__1__ quality is not researched yet. The loop will be placed, but those buildings cannot be built until it is.
no-pole-researched=No electric pole researched yet. The loop will be placed without power poles.
consumers-unpowered=__1__ __plural_for_parameter__1__{1=building is|rest=buildings are}__ beyond the poles' reach. Use a longer-reaching pole, or power __plural_for_parameter__1__{1=it|rest=them}__ manually.
no-cursor=You need a character to hold the placement tool.
cursor-full=Inventory full — free a slot and press Place again.
plan-failed=That upcycler can no longer be planned. Open the planner and try again.
placement-blocked=Not enough room here. Clear the area or pick another spot.
placed=Upcycler planned: __1__ ghosts.
placed-unpowered=Upcycler planned: __1__ ghosts. __2__ __plural_for_parameter__2__{1=building is|rest=buildings are}__ beyond the poles' reach.
