beacon-too-tall=__1__ is too tall to stand inside the loop.
beacon-out-of-reach=__1__ can't reach both the machine and the recycler on its tier.
consumers-unpowered=__1__ __plural_for_parameter__1__{1=building is|rest=buildings are}__ outside the supply area. Pick a pole with more reach, or power __plural_for_parameter__1__{1=it|rest=them}__ yourself.
circuit-unlinked=__1__ __plural_for_parameter__1__{1=building is|rest=buildings are}__ too far for a circuit wire and will run without limits.
