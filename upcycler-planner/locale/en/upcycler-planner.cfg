[mod-name]
upcycler-planner=Upcycler Planner

[mod-description]
upcycler-planner=Pick an item and a target quality, and get a ready-made upcycling loop blueprint.
[shortcut-name]
upl-open=Upcycler Planner

[shortcut-description]
upl-open=Design an upcycling loop and get it as a blueprint.

[controls]
upl-open=Toggle Upcycler Planner

[upl-gui]
title=Upcycler Planner
settings=Settings
settings-tooltip=Choose whether the planner shows unresearched items.
recipe=Item to upcycle
recipe-tooltip=Only items that recycle back into their own ingredients can be looped.
quality=Target quality
quality-tooltip=The loop upgrades one tier at a time, up to this quality.
machine=Crafting machine
machine-tooltip=Crafts the item at each quality tier. The quality here is the machine's own, not the item's.
recycler=Recycler
recycler-tooltip=Turns each lower tier's items back into ingredients. The quality here is the recycler's own.
layout=Layout
layout-tooltip=How items move between tiers: on a belt ring, or carried by your robots. Bots need no belts, but always upcycle what your network holds of the item.
layout-belt=Belts
layout-bot=Bots
tab-buildings=Buildings
tab-modules=Modules
tab-chests=Chests
tab-circuits=Circuits
requests=Ingredient amounts
requests-tooltip=How much of each ingredient the ingredient chests request from your logistic network.
feed-minutes=Minutes
feed-minutes-tooltip=Each ingredient is requested for about this many minutes of crafting. Changing it resets the amounts below.
request-count-tooltip=How many of this ingredient each tier requests. Clear the field and press Enter to follow the minutes again.
columns=Columns per tier
columns-tooltip=More columns for a tier means more output from a bigger blueprint. One each by default.
columns-count-tooltip=How many columns this tier repeats, up to __1__. Clear the field and press Enter to go back to one.
belt=Belt
belt-tooltip=Carries items around the loop. Belts have no quality bonus, so there is none to pick.
inserter=Inserter
inserter-tooltip=Only inserters that reach one tile fit the layout. Higher quality swings faster.
requester=Ingredient chest
requester-tooltip=Requests each machine's ingredients from your logistic network. Higher quality holds more.
stock=Stock chest
stock-tooltip=Holds each tier's items until its recycler takes them. Higher quality holds more.
container=Relay chest
container-tooltip=Passes ingredients that rolled above their tier back onto the belt. Higher quality holds more.
provider=Output chest
provider-tooltip=A passive provider for your finished items. Higher quality holds more.
overflow=Overflow chest
overflow-tooltip=Bots take away anything the loop rolls above your target quality. Higher quality holds more.
overflow-bot-tooltip=Hands each tier's items to your bots, which deliver them or put them in storage. Higher quality holds more.
quality-module=Quality module
quality-module-tooltip=Goes in every recycler and the lower machines. Higher quality raises the odds.
terminal-module=Final machine module
terminal-module-tooltip=Goes only in the final machine, the one at your target quality. Nothing rolls higher there, so it defaults to productivity. Clear to leave it empty.
productivity-module=Productivity module
productivity-module-tooltip=Mixed in with the quality modules in the lower machines. Empty when no productivity module works here yet.
split-enabled=Mix productivity modules
split-enabled-tooltip=Adds productivity modules to the lower machines, at the best ratio for your setup. Untick for quality modules only.
split-count-tooltip=How many of this tier's module slots get a productivity module. The rest get quality modules. Clear the field and press Enter for the best ratio.
split-of=of __1__ slots
split-no-productivity=No productivity module for this recipe is researched yet, so every machine gets quality modules.
pole=Electric pole
pole-tooltip=Powers every building. Higher quality reaches further. Clear to place no poles.
pipe=Pipe
pipe-tooltip=Feeds fluid to the machines. Connect your supply from either side with an underground pipe. No quality bonus.
beacon=Beacon
beacon-tooltip=Boosts each tier's machine and recycler, and widens the loop. Higher quality boosts more. Clear to place none.
beacon-module=Beacon module
beacon-module-tooltip=Fills every beacon. Defaults to efficiency, since speed modules lower quality odds. Clear to leave them empty.
beacon-count=Beacons per tier
beacon-count-tooltip=How many beacons each tier gets. More beacons add no width, but each extra one helps a little less.
circuit-enabled=Circuit limits
circuit-enabled-tooltip=Stops the loop at your maximum, and keeps a minimum of each lower quality.
circuit-min=Min
circuit-max=Max
circuit-keep-tooltip=How many items of this quality to keep instead of recycling them. 0 keeps none.
circuit-max-tooltip=The loop stops at this count, and starts again when you take items out. 0 means no limit.
circuit-hand=Hand size
circuit-hand-tooltip=How many items the reserve inserters take per swing. Clear the field and press Enter for what your research allows.
circuit-network=Count the whole logistic network
circuit-network-tooltip=The maximum counts your whole logistic network, not just the output chest. The loop then only runs inside roboport range.
circuit-network-bots-tooltip=Always on with Bots: robots carry items to storage, so the whole network is counted.
circuit-paused=Start paused
circuit-paused-tooltip=Builds the loop with its constant combinator switched off. Switch it on to start.
buffer-stock=Use buffer chests
buffer-stock-tooltip=Stock chests become buffer chests, so your bots can use what they hold. Untick to keep items in the loop.
stock-requests=Upcycle items from the network
stock-requests-tooltip=Stock chests also request the item from your network, so the loop upcycles what you already have. Untick to recycle only what it makes.
terminal-requests=Final machine requests ingredients
terminal-requests-tooltip=The final machine's ingredient chest requests at your target quality. Untick if you recycle the finished items for their ingredients.
trash-unrequested=Trash unrequested items
trash-unrequested-tooltip=Bots clear anything a chest did not request, so nothing clogs the loop.
footprint=Footprint: __1__ x __2__ tiles
summary=__1__ machines, __2__ __plural_for_parameter__2__{1=recycler|rest=recyclers}__
yield=About __1__ __2__ in for one __3____2__ out
time-seconds=About one __1____2__ out every __3__ __plural_for_parameter__3__{1=second|rest=seconds}__
time-minutes=About one __1____2__ out every __3__ minutes
time-hours=About one __1____2__ out every __3__ hours
time-days=About one __1____2__ out every __3__ days
confirm=Place
cancel=Cancel
pick-a-recipe=Pick an item to upcycle.

[mod-setting-name]
upcycler-planner-show-all=Show unresearched items

[mod-setting-description]
upcycler-planner-show-all=Offer every item, machine and building in the planner, researched or not.

