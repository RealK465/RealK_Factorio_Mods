[mod-name]
upcycler-planner=Upcycler Planner

[mod-description]
upcycler-planner=Choose an item and a target quality, the mod designs the entire upcycling loop blueprint and places it as ghosts.
[shortcut-name]
upl-open=Upcycler Planner

[shortcut-description]
upl-open=Design an upcycling loop and get it as a blueprint.

[controls]
upl-open=Toggle Upcycler Planner

[upl-gui]
title=Upcycler Planner
settings=Settings
settings-tooltip=Toggle unresearched items and hidden build options.
recipe=Item to upcycle
recipe-tooltip=Only items that recycle back into their own ingredients can be looped.
quality=Target quality
quality-tooltip=The loop upgrades one tier at a time, up to this quality.
machine=Crafting machine
machine-tooltip=One per quality tier. Quality here is the machine's own, not the items'.
recycler=Recycler
recycler-tooltip=Recycles below the target tier. Quality here is the recycler's own.
build-options=Build options
group-transport=Transport
group-chests=Chests
group-modules=Modules
group-beacons=Beacons
group-power=Power
belt=Belt
belt-tooltip=Belt for the loop ring. Belt quality has no effect.
inserter=Inserter
inserter-tooltip=Only single-tile inserters fit the layout. Higher quality swings faster.
requester=Requester chest
requester-tooltip=Feeds each machine from logistics. Higher quality holds more.
container=Buffer chest
container-tooltip=Holds ingredients rolled above their tier. Higher quality holds more.
provider=Output chest
provider-tooltip=Passive provider for finished items. Higher quality holds more.
overflow=Overflow chest
overflow-tooltip=Active provider. Bots collect anything the loop rolls above your target quality.
quality-module=Quality module
quality-module-tooltip=Goes in every machine and recycler below the target tier.
terminal-module=Top machine module
terminal-module-tooltip=Goes in the last machine only. Quality can't roll higher there, so this defaults to productivity. Clear to leave it empty.
pole=Electric pole
pole-tooltip=Powers every building. Clear to place no poles.
pipe=Pipe
pipe-tooltip=For fluid recipes. Connect your supply from either side with an underground pipe.
beacon=Beacon
beacon-tooltip=One per tier, boosting that tier's machine and recycler. Widens the loop. Clear to place none.
beacon-module=Beacon module
beacon-module-tooltip=Fills the beacon. Defaults to efficiency: speed modules also lower quality odds on everything the beacon reaches. Clear to leave it empty.
trash-unrequested=Trash unrequested items
trash-unrequested-tooltip=Bots remove anything not requested, preventing clogs.
footprint=Footprint: __1__ x __2__ tiles
summary=__1__ machines, __2__ __plural_for_parameter__2__{1=recycler|rest=recyclers}__
confirm=Place
cancel=Cancel
pick-a-recipe=Pick an item to upcycle.

[mod-setting-name]
upcycler-planner-show-all=Show unresearched items
upcycler-planner-show-all-build-options=Show all build options

[mod-setting-description]
upcycler-planner-show-all=Show every item, machine and quality in the planner, even before research.
upcycler-planner-show-all-build-options=Show every build option picker, including the chests and the ones with only one choice.

