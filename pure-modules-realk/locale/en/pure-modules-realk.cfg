[mod-name]
pure-modules-realk=Pure Modules

[mod-description]
pure-modules-realk=A top tier of modules above tier 3: no speed penalty, no quality penalty, only power and a little pollution. Comes with a wide-area beacon built for the tier, where three out-transmit anything the base game can put on one machine. Optional Quality and Space Age support.

[mod-setting-name]
pure-modules-realk-aquilo-only=Assemble on Aquilo only
pure-modules-realk-restrict-to-pure-beacon=Pure modules fit only the Pure beacon
pure-modules-realk-beacon-allow-productivity=Pure beacon transmits productivity
pure-modules-realk-beacon-allow-quality=Pure beacon transmits quality

[mod-setting-description]
pure-modules-realk-aquilo-only=Pure modules and the Pure beacon can only be built on Aquilo. Once built, they work anywhere.
pure-modules-realk-restrict-to-pure-beacon=Ordinary beacons refuse Pure modules, so only the Pure beacon carries them. Machines take them either way.
pure-modules-realk-beacon-allow-productivity=Lets the Pure beacon carry productivity modules and broadcast their bonus. No beacon does this in the base game, and it is a large swing. Costs 4 MW more power, and more pollution.
pure-modules-realk-beacon-allow-quality=Lets the Pure beacon carry quality modules and broadcast their bonus. No beacon does this in the base game. Costs 2 MW more power, and more pollution.

[item-name]
pure-speed-module=Pure speed module
pure-productivity-module=Pure productivity module
pure-quality-module=Pure quality module

[item-description]
pure-speed-module=Speeds a machine up hard, and costs nothing but power and a little pollution. Quality is left alone.
pure-productivity-module=Yields extra products with no slowdown, for power and a little pollution.
pure-quality-module=Improves the quality of results, and asks for nothing in return.

[entity-name]
pure-beacon=Pure beacon

[entity-description]
pure-beacon=A wide-area beacon, rebuilt around a resonant crystal. Takes speed and efficiency modules of any grade, Pure or ordinary. Three on one machine is as far as it goes. It draws hard and smokes for as long as it is switched on.

[technology-name]
pure-speed-module=Pure speed module
pure-productivity-module=Pure productivity module
pure-quality-module=Pure quality module
pure-beacon=Pure beacon

[technology-description]
pure-speed-module=A refined speed module that no longer degrades what the machine turns out.
pure-productivity-module=A refined productivity module that costs the machine none of its speed.
pure-quality-module=A refined quality module, free of any drawback at all.
pure-beacon=A beacon rebuilt around a resonant crystal, covering far more ground than its ancestor and transmitting harder.
