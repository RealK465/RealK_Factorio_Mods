[mod-name]
pure-modules-realk=Pure Modules

[mod-description]
pure-modules-realk=A top tier of modules above tier 3, stronger and only costing power and a little pollution: no speed penalty, no quality penalty. Comes with a wide-area beacon built for the tier, taking speed and efficiency modules of any grade and stacking up to three per machine. Optional Quality and Space Age support.

[mod-setting-name]
pure-modules-realk-aquilo-only=Assemble on Aquilo only
pure-modules-realk-restrict-to-pure-beacon=Pure modules fit only the Pure beacon
pure-modules-realk-beacon-allow-productivity=Pure beacon transmits productivity
pure-modules-realk-beacon-allow-quality=Pure beacon transmits quality

[mod-setting-description]
pure-modules-realk-aquilo-only=The Pure modules and the Pure beacon can only be built on Aquilo. Once built they work anywhere. Has no effect without Space Age, where there is no Aquilo.
pure-modules-realk-restrict-to-pure-beacon=Ordinary beacons refuse Pure modules, leaving the Pure beacon the only one that will carry them. Machines take Pure modules either way.
pure-modules-realk-beacon-allow-productivity=Lets productivity modules into the Pure beacon and broadcasts their bonus. No beacon does this in the base game, and it is a large swing in favour of the factory. Raises the beacon's power draw by 2 MW.
pure-modules-realk-beacon-allow-quality=Lets quality modules into the Pure beacon and broadcasts their bonus. No beacon does this in the base game. Raises the beacon's power draw by 1 MW.

[item-name]
pure-speed-module=Pure speed module
pure-productivity-module=Pure productivity module
pure-quality-module=Pure quality module

[item-description]
pure-speed-module=Speeds a machine up hard, and costs nothing but power and a little pollution. Quality is left alone.
pure-productivity-module=Yields extra products with no slowdown, for power and a little pollution.
pure-quality-module=Improves the quality of results, and asks for nothing in return.

[entity-name]
pure-beacon=Pure beacon

[entity-description]
pure-beacon=A wide-area beacon, rebuilt around a resonant crystal. Takes speed and efficiency modules of any grade, Pure or ordinary; two mod settings widen that to productivity and quality.

[technology-name]
pure-speed-module=Pure speed module
pure-productivity-module=Pure productivity module
pure-quality-module=Pure quality module
pure-beacon=Pure beacon

[technology-description]
pure-speed-module=A refined speed module that no longer degrades what the machine turns out.
pure-productivity-module=A refined productivity module that costs the machine none of its speed.
pure-quality-module=A refined quality module, free of any drawback at all.
pure-beacon=A beacon rebuilt around a resonant crystal, covering far more ground than its ancestor.
