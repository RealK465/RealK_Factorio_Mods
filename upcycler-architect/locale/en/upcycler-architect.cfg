[mod-name]
upcycler-architect=Upcycler Architect

[mod-description]
upcycler-architect=Pick an item and a target quality, and have a complete upcycling loop designed and placed as ghosts. In early development, not yet released.

[shortcut-name]
ua-open=Upcycler Architect

[shortcut-description]
ua-open=Design an upcycling loop for one item and place it as ghosts.

[item-name]
ua-planner=Upcycler placement tool

[item-description]
ua-planner=Click the ground where the upcycler should be built.

[ua-gui]
title=Upcycler Architect
recipe=Item to upcycle
recipe-tooltip=The item the loop crafts and recycles. Only items whose recycling gives back their own ingredients can be looped.
quality=Target quality
quality-tooltip=The loop climbs one tier at a time up to this quality, and stops there.
machine=Crafting machine
machine-tooltip=One of these is placed per quality tier. More module slots and built-in productivity mean a better loop.
recycler=Recycler
recycler-tooltip=Placed under each machine below the target, so what it recovers goes straight back in.
belt=Belt
belt-tooltip=The belt the loop's ring is built from. The fastest belt you have researched is the default; a slower one is cheaper and usually plenty, the ring is short.
trash-unrequested=Trash unrequested items
trash-unrequested-tooltip=The loop's requester chests ask logistic bots to take away anything they are not requesting, so a wrong-quality roll or a leftover cannot clog a slot. Untick to keep bots from hauling surplus off to storage.
footprint=Footprint: __1__ x __2__ tiles
summary=__1__ machines, __2__ __plural_for_parameter__2__{1=recycler|rest=recyclers}__
confirm=Place
cancel=Cancel
pick-a-recipe=Pick an item to upcycle.

[mod-setting-name]
upcycler-architect-show-all=Show unresearched options

[mod-setting-description]
upcycler-architect-show-all=Offer every item, machine, quality, belt and recycler in the planner even before it is researched, the way the game's own "Show all items in selection lists" option does elsewhere.

[ua-message]
no-recycling-path=__1__ cannot be recycled, so a loop cannot return its ingredients.
recycling-mismatch=Recycling __1__ does not give back the ingredients of this recipe, so the loop would leak.
fluid-not-supported=Recipes that use fluids are not supported yet.
too-many-ingredients=This recipe has more ingredients than an inserter can filter for.
only-fuelled-inserters=Every inserter you can build runs on fuel, which an unattended loop cannot keep supplied. Research an electric inserter.
no-module-slots=__1__ has no module slots, so it cannot roll for quality.
no-quality-effect=__1__ cannot take quality modules.
quality-not-researched=__1__ is not researched yet. The loop will be built, but will not reach that quality until it is.
recipe-not-researched=This recipe is not researched yet. The loop will be built, but will not run until it is.
no-machine-available=No machine you can build is able to craft this recipe.
no-recycler=Pick a recycler.
recycler-no-eject=__1__ cannot throw its recycled output into a machine above it, so the loop cannot use it.
recycler-needs-wider-machine=__1__ needs a crafting machine at least __2__ tiles wide above it, so its thrown output lands inside the machine.
no-belt=No transport belt researched yet.
no-chest=No chest researched yet.
no-logistic-chest=Requester and passive provider chests are not researched yet.
no-quality-module=No quality module researched yet.
no-cursor=You need a character to hold the placement tool.
cursor-full=No room to take the placement tool: what you are holding cannot be put away. Free an inventory slot and press Place again.
plan-failed=That upcycler can no longer be planned. Open the planner and try again.
placement-blocked=Not enough room here. Clear the area or pick another spot.
placed=Upcycler planned: __1__ ghosts.
