[mod-name]
assembly-planner=Assembly Planner

[mod-description]
assembly-planner=Pick an item and get a ready-made bot mall blueprint for it.

[shortcut-name]
apl-open=Assembly Planner

[shortcut-description]
apl-open=Design a mall cell for one item and get it as a blueprint.

[controls]
apl-open=Toggle Assembly Planner

[apl-gui]
title=Assembly Planner
settings=Settings
settings-tooltip=Show unresearched items.
item=Item
item-tooltip=What the cell makes. The quality you pick is the quality it crafts at.
recipe=Recipe
recipe-tooltip=Several recipes make this item. Pick the one the cell uses.
machine=Crafting machine
machine-tooltip=Machines that can craft this recipe. The quality here is the machine's own.
module=Machine modules
module-tooltip=Fills every slot of the machine. Clear to leave it empty.
build-options=Build options
group-logistics=Logistics
group-beacons=Beacons
group-power=Power
group-requests=Ingredient requests
group-stock=Stock limit
inserter=Inserter
inserter-tooltip=Only inserters that reach one tile fit the cell. Higher quality swings faster.
requester=Ingredient chest
requester-tooltip=Requests the recipe's ingredients from your logistic network. Higher quality holds more.
output=Output chest
output-tooltip=A passive provider for the finished items. Higher quality holds more.
pipe=Pipe
pipe-tooltip=Runs along the back of the cell. Cells side by side join into one line; feed it from either end.
beacon=Beacon
beacon-tooltip=Beacons stand beside and above the machine. Clear to place none.
beacon-module=Beacon module
beacon-module-tooltip=Fills every beacon. Clear to leave them empty.
beacons-side=Per side
beacons-side-tooltip=Beacons on each side of the machine.
beacons-above=Above
beacons-above-tooltip=Beacons in the row above the machine.
pole=Electric pole
pole-tooltip=Powers the cell. Clear to place no poles and power it yourself.
size-crafts=Crafts
size-minutes=Minutes
size-mode-tooltip=Request enough ingredients for a number of crafts, or for minutes of crafting.
size-value-tooltip=How many crafts or minutes of ingredients to request. Changing it resets the amounts set by hand.
requests-edit=Edit...
requests-edit-tooltip=Set the amount of each ingredient by hand.
requests-title=Ingredient amounts
request-count-tooltip=How many of this ingredient to request. Several ingredient chests share a large amount, and each takes a small one whole. Empty and press Enter to go back to the automatic amount.
no-ingredients=Pick an item with item ingredients first.
trash-unrequested=Trash unrequested items
trash-unrequested-tooltip=Bots take away anything the ingredient chest did not request.
cap-slots=Chest slots
cap-network=Network count
cap-none=No limit
cap-mode-tooltip=How the cell stops once it has made enough.
cap-slots-tooltip=The cell stops once this many output slots are full, with at least one slot per output chest.
cap-network-tooltip=The cell stops when your logistic network holds this many of the item.
split=Split outputs by quality
split-tooltip=Items at the recipe's quality go to the output chests, better ones to a chest of their own. Turns on by itself when the cell can make better quality.
footprint=Footprint: __1__ x __2__ tiles
rate=About __1__ crafts a minute
quality-chance=Quality chance: __1__%
pick-an-item=Pick an item to make.
confirm=Place
cancel=Cancel

[mod-setting-name]
assembly-planner-show-all=Show unresearched items

[mod-setting-description]
assembly-planner-show-all=Offer every item, machine and building in the planner, researched or not.

