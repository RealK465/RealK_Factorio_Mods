[mod-setting-description]
rwcr-early-robots=Which robot recipes you can craft from the start; each choice includes the ones before it.
rwcr-cheap-recipes=With Early robots on, the robots, chests and roboports it unlocks cost only iron plates, gears and circuits.
rwcr-enable-quick-start=New freeplay games start with buildings, robots and roboports in your inventory.
rwcr-start-with-power-armor=New players start wearing power armor MK2 with a reactor, personal roboports, batteries, an exoskeleton and night vision.
rwcr-construction-robot-speed-multiplier=How fast construction robots fly.
rwcr-construction-robot-carry-size-multiplier=Rounded to whole items.
rwcr-construction-robot-battery-size-multiplier=How much energy a construction robot can store.
rwcr-construction-robot-energy-usage-multiplier=Energy used while flying and hovering.
rwcr-logistics-robot-speed-multiplier=How fast logistic robots fly.
rwcr-logistics-robot-carry-size-multiplier=Rounded to whole items.
rwcr-logistics-robot-battery-size-multiplier=How much energy a logistic robot can store.
rwcr-logistics-robot-energy-usage-multiplier=Energy used while flying and hovering.
rwcr-robot-health-multiplier=For construction and logistic robots.
rwcr-robot-stack-size=How many robots fit in one inventory slot, for every robot type.
rwcr-roboport-logistics-radius-multiplier=The area where robots deliver items.
rwcr-roboport-construction-radius-multiplier=The area where robots build.
rwcr-roboport-charging-rate-multiplier=How fast roboports charge robots; their energy storage grows with it.
rwcr-roboport-energy-usage-multiplier=The power a roboport uses while idle.
rwcr-only-modify-vanilla-roboport=Roboports from other mods keep their own stats.
rwcr-inserter-speed-multiplier=For every inserter, including ones from other mods.

[string-mod-setting]
rwcr-early-robots-off=Off
rwcr-early-robots-construction=Construction robots
rwcr-early-robots-logistic=Construction and logistic robots
rwcr-early-robots-logistic-system=Full logistic system

[technology-name]
rwcr-early-character-logistic-slots=Basic personal logistics
rwcr-early-character-logistic-trash-slots=Basic logistic trash slots
rwcr-early-worker-robots-speed=Basic worker robot speed
rwcr-early-worker-robots-storage=Basic worker robot cargo size

[technology-description]
rwcr-early-character-logistic-slots=Lets you request items from the logistic network. Logistic robots deliver them.
rwcr-early-character-logistic-trash-slots=Lets you send unwanted items to the logistic network. Logistic robots take them away.
rwcr-early-worker-robots-speed=Logistic and construction robots fly faster.
rwcr-early-worker-robots-storage=Logistic and construction robots carry more items at once.
